; Water Level Monitor firmware — ESP32 DevKit V1 (30 ขา) + JSN-SR04T + ThingsBoard

[esp32_base]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.1.0

; ใช้งานจริง: วัด + ส่งขึ้น ThingsBoard (ต้องมี src/secrets.h)
[env:devkit]
extends = esp32_base

; ทดสอบเซนเซอร์อย่างเดียว: พิมพ์ค่าทาง Serial Monitor ทุก 0.5 วิ ไม่ต่อ Wi-Fi
[env:sensor_test]
extends = esp32_base
build_flags = -DSENSOR_TEST_ONLY
build_src_filter = +<*> -<net.cpp>

; ทดสอบสูตรคำนวณบนคอม: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
